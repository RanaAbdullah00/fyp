name: Production sync check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            transpak-backend/package-lock.json
            transpak-frontend/package-lock.json

      - name: Install backend deps
        working-directory: transpak-backend
        run: npm ci

      - name: Install frontend deps
        working-directory: transpak-frontend
        run: npm ci

      - name: Backend build
        working-directory: transpak-backend
        run: npm run build

      - name: Frontend build
        working-directory: transpak-frontend
        env:
          VITE_API_URL: https://transpak-backend-1.onrender.com
        run: npm run build

      - name: Live QA (non-blocking deploy sync)
        working-directory: transpak-backend
        run: npm run deploy:qa || true
        continue-on-error: true

# TransPak — Render Blueprint (free Web Service + free Postgres).
# Use from Git root (this file): Dashboard → New → Blueprint → select repo/branch.
#
# Do NOT set PORT in Render Environment — the platform injects it (HTTPS URL maps to that port only).
#
# After the first successful deploy, migrations run automatically on start (npm run db:migrate).
# Manual fallback in Render Shell:
#   cd transpak-backend && npm run db:ensure-notifications
#
# CORS_ORIGIN is set below for Cloudflare Pages + Render; override in the Dashboard if your frontend URL changes.
#
# Add in Dashboard as needed: Brevo/SMTP, Cloudinary, etc. (see transpak-backend/.env.example)

databases:
  - name: transpak-db
    plan: free
    databaseName: transpak

services:
  - type: web
    name: transpak-backend
    runtime: node
    plan: free
    rootDir: transpak-backend
    branch: main
    autoDeploy: true
    # Clear build cache in Dashboard on manual deploy if behavior looks stale.
    buildCommand: rm -rf node_modules dist .render-build-stamp.json && npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:ensure-capacity-bridge && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: transpak-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://transpak-frontend.pages.dev,https://cb3857ee.transpak-frontend.pages.dev,https://626c52a8.transpak-frontend.pages.dev,https://20f26555.transpak-frontend.pages.dev,https://1c7c2150.transpak-frontend.pages.dev,https://transpak-backend-1.onrender.com"
      # Local Vite → prod API (optional). Remove if you want production-only origins.
      - key: CORS_EXTRA_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: ALLOW_VEHICLE_TYPE_MISMATCH
        value: "true"
      # Set in Render Dashboard (never commit): ORS_API_KEY — OpenRouteService routing proxy
